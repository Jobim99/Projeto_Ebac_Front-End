<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <title>AGENDA DE CONTATOS</title>
</head>
<body>
    <div class="container">
        <header>
            <img src="img/livro-de-contato.png" alt="LOGO DO SITE">
            <h1>AGENDA DE CONTATOS</h1>
        </header>
        <form id="form-contato">
            <input type="text" required placeholder="Nome do Contato" id="nome-contato">
            <input type="text" required placeholder="(51)123456789" id="numero-contato">
            <button type="submit">Cadastrar</button>
        </form>
        <table cellspacing="0">
            <thead>
                <tr>
                    <th>Nome:</th>
                    <th>Telefone:</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Numero de contatos</td>
                    <td id="quantidade-de-contatos"></td>
                    <td><img src="img/aplicativo-movel.png" alt=""></td>
                </tr>
            </tbody>
            <tbody id="tbody-1">
            </tbody>
            <tfoot>
            </tfoot>
        </table>
    </div>
    <script src="main.js"></script>
</body>
</html>
